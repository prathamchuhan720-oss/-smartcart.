[flake8]
max-line-length = 120
exclude =
    venv,
    migrations,
    __pycache__,
    manage.py,
    settings

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 120
skip = venv,migrations

[coverage:run]
source = .
omit =
    venv/*
    */migrations/*
    */tests/*
    manage.py
    config/*

[coverage:report]
show_missing = True
fail_under = 60
