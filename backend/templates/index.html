<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartCart – E-Commerce Store & Admin Control Center</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  {% verbatim %}
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Axios client configuration
    const api = axios.create({
      baseURL: '/api/',
      headers: { 'Content-Type': 'application/json' }
    });

    api.interceptors.request.use((config) => {
      const token = localStorage.getItem('smartcart_access');
      if (token) config.headers.Authorization = `Bearer ${token}`;
      return config;
    });

    api.interceptors.response.use(
      (res) => res,
      (err) => {
        if (err.response && err.response.status === 401) {
          localStorage.removeItem('smartcart_access');
          localStorage.removeItem('smartcart_refresh');
          localStorage.removeItem('smartcart_user');
        }
        return Promise.reject(err);
      }
    );

    // ==========================================
    // ROOT APP COMPONENT (MODE DISPATCHER)
    // ==========================================
    function App() {
      // Primary Mode: 'customer' or 'admin'
      const [appMode, setAppMode] = useState(() => {
        const saved = localStorage.getItem('smartcart_mode');
        return saved === 'admin' ? 'admin' : 'customer';
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('smartcart_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [toast, setToast] = useState(null);
      const [authModal, setAuthModal] = useState(null); // 'login', 'register', 'admin-login'

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const switchMode = (mode) => {
        if (mode === 'admin') {
          if (!currentUser) {
            setAuthModal('admin-login');
            return;
          }
          if (!currentUser.is_admin) {
            showToast('Access denied: Admin credentials required.', 'error');
            setAuthModal('admin-login');
            return;
          }
        }
        setAppMode(mode);
        localStorage.setItem('smartcart_mode', mode);
      };

      const handleQuickLogin = async (email, password, targetMode) => {
        try {
          const res = await api.post('auth/login/', { email, password });
          const { access, refresh, user } = res.data.data || res.data;
          localStorage.setItem('smartcart_access', access);
          localStorage.setItem('smartcart_refresh', refresh);
          localStorage.setItem('smartcart_user', JSON.stringify(user));
          setCurrentUser(user);
          setAuthModal(null);
          showToast(`Logged in as ${user.full_name} (${user.role.toUpperCase()})`);
          if (targetMode) {
            setAppMode(targetMode);
            localStorage.setItem('smartcart_mode', targetMode);
          }
        } catch (err) {
          showToast('Login failed: ' + (err.response?.data?.message || 'Invalid credentials'), 'error');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('smartcart_access');
        localStorage.removeItem('smartcart_refresh');
        localStorage.removeItem('smartcart_user');
        setCurrentUser(null);
        setAppMode('customer');
        localStorage.setItem('smartcart_mode', 'customer');
        showToast('Logged out successfully');
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Top Quick Role Switcher Banner */}
          <div className="bg-slate-900 text-xs text-slate-300 py-1.5 px-4 flex flex-wrap items-center justify-between border-b border-slate-800 z-50">
            <div className="flex items-center gap-3">
              <span className="flex items-center gap-1.5 font-semibold text-slate-200">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Mode: <strong className="text-white uppercase tracking-wider">{appMode === 'admin' ? 'Admin Portal' : 'Customer Store'}</strong>
              </span>
              <span className="text-slate-600">|</span>
              <button
                onClick={() => switchMode(appMode === 'admin' ? 'customer' : 'admin')}
                className={`px-2.5 py-0.5 rounded-full font-bold text-[11px] transition-all flex items-center gap-1.5 ${
                  appMode === 'admin'
                    ? 'bg-indigo-600 text-white hover:bg-indigo-500'
                    : 'bg-emerald-600 text-white hover:bg-emerald-500'
                }`}>
                <i className={`fa-solid ${appMode === 'admin' ? 'fa-store' : 'fa-shield-halved'}`}></i>
                Switch to {appMode === 'admin' ? 'Customer Mode' : 'Admin Mode'}
              </button>
            </div>

            <div className="flex items-center gap-3 text-[11px]">
              <span className="hidden sm:inline text-slate-400">Quick Test Logins:</span>
              <button
                onClick={() => handleQuickLogin('customer@smartcart.com', 'Customer@12345', 'customer')}
                className="hover:text-white text-indigo-300 underline font-medium">
                Customer (John)
              </button>
              <button
                onClick={() => handleQuickLogin('admin@smartcart.com', 'Admin@12345', 'admin')}
                className="hover:text-white text-amber-300 underline font-medium">
                Admin (Manager)
              </button>
              <span className="text-slate-600">|</span>
              <a href="/api/docs/" target="_blank" className="hover:text-white text-slate-400 flex items-center gap-1">
                <i className="fa-solid fa-code"></i> API Docs
              </a>
            </div>
          </div>

          {/* Render Mode Component */}
          {appMode === 'admin' ? (
            <AdminPortal
              currentUser={currentUser}
              showToast={showToast}
              onSwitchToCustomer={() => switchMode('customer')}
              onLogout={handleLogout}
            />
          ) : (
            <CustomerStore
              currentUser={currentUser}
              showToast={showToast}
              onOpenAuthModal={(t) => setAuthModal(t)}
              onLogout={handleLogout}
              onSwitchToAdmin={() => switchMode('admin')}
            />
          )}

          {/* Authentication Modal */}
          {authModal && (
            <AuthModal
              type={authModal}
              onClose={() => setAuthModal(null)}
              onSuccess={(user) => {
                setCurrentUser(user);
                setAuthModal(null);
                showToast(`Welcome, ${user.full_name || user.username}!`);
                if (authModal === 'admin-login') {
                  if (user.is_admin) switchMode('admin');
                  else showToast('Account is not an administrator.', 'error');
                }
              }}
              onSwitch={(t) => setAuthModal(t)}
              showToast={showToast}
            />
          )}

          {/* Toast Alert */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl border text-sm transition-all duration-300 ${
              toast.type === 'error'
                ? 'bg-rose-50 text-rose-800 border-rose-200'
                : 'bg-emerald-50 text-emerald-800 border-emerald-200'
            }`}>
              <i className={`fa-solid ${toast.type === 'error' ? 'fa-triangle-exclamation text-rose-500' : 'fa-circle-check text-emerald-500'} text-base`}></i>
              <span className="font-semibold">{toast.message}</span>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // SECTION 1: ACCURATE CUSTOMER APPLICATION
    // =========================================================================
    function CustomerStore({ currentUser, showToast, onOpenAuthModal, onLogout, onSwitchToAdmin }) {
      const [customerTab, setCustomerTab] = useState('shop'); // 'shop', 'orders', 'wishlist', 'profile'
      const [cart, setCart] = useState(null);
      const [cartOpen, setCartOpen] = useState(false);
      const [wishlistCount, setWishlistCount] = useState(0);

      // Filter states
      const [searchQuery, setSearchQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('');
      const [activeBrand, setActiveBrand] = useState('');
      const [priceRange, setPriceRange] = useState(150000);
      const [minRating, setMinRating] = useState(0);
      const [inStockOnly, setInStockOnly] = useState(false);
      const [ordering, setOrdering] = useState('-created_at');

      const [selectedProduct, setSelectedProduct] = useState(null);

      const fetchCart = async () => {
        try {
          const res = await api.get('cart/');
          setCart(res.data.data || res.data);
        } catch (err) {}
      };

      const fetchWishlist = async () => {
        if (!currentUser) return;
        try {
          const res = await api.get('wishlist/');
          const data = res.data.data || res.data;
          setWishlistCount(data.total_items || 0);
        } catch (err) {}
      };

      useEffect(() => {
        fetchCart();
        fetchWishlist();
      }, [currentUser]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Customer Header */}
          <header className="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 gap-4">
                {/* Logo */}
                <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCustomerTab('shop')}>
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white text-xl shadow-md shadow-indigo-100">
                    <i className="fa-solid fa-cart-shopping"></i>
                  </div>
                  <div>
                    <h1 className="font-extrabold text-xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">
                      SmartCart
                    </h1>
                    <span className="text-[10px] text-slate-400 font-bold block -mt-1 tracking-wider uppercase">Customer Store</span>
                  </div>
                </div>

                {/* Live Search Input */}
                <div className="flex-1 max-w-lg relative hidden md:block">
                  <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                  <input
                    type="text"
                    placeholder="Search phones, sportswear, electronics, audio..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-4 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  )}
                </div>

                {/* Action Buttons */}
                <div className="flex items-center gap-3">
                  {currentUser?.is_admin && (
                    <button
                      onClick={onSwitchToAdmin}
                      className="px-3 py-1.5 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800 flex items-center gap-1.5 shadow-sm transition-all">
                      <i className="fa-solid fa-gauge-high text-amber-400"></i> Admin Panel
                    </button>
                  )}

                  {/* Wishlist Button */}
                  <button
                    onClick={() => {
                      if (!currentUser) onOpenAuthModal('login');
                      else setCustomerTab('wishlist');
                    }}
                    className="relative p-2.5 rounded-xl text-slate-600 hover:bg-slate-100 transition-colors"
                    title="Wishlist">
                    <i className="fa-regular fa-heart text-lg"></i>
                    {wishlistCount > 0 && (
                      <span className="absolute top-1 right-1 w-4 h-4 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center">
                        {wishlistCount}
                      </span>
                    )}
                  </button>

                  {/* Cart Drawer Trigger */}
                  <button
                    onClick={() => setCartOpen(true)}
                    className="relative p-2.5 rounded-xl text-slate-600 hover:bg-slate-100 transition-colors"
                    title="Cart">
                    <i className="fa-solid fa-bag-shopping text-lg"></i>
                    {cart?.total_items > 0 && (
                      <span className="absolute top-1 right-1 w-4 h-4 bg-indigo-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center">
                        {cart.total_items}
                      </span>
                    )}
                  </button>

                  {/* User Profile / Auth State */}
                  {currentUser ? (
                    <div className="relative group">
                      <button className="flex items-center gap-2 pl-2 pr-3 py-1.5 bg-slate-100 rounded-xl hover:bg-slate-200 transition-colors">
                        <div className="w-7 h-7 rounded-lg bg-indigo-600 text-white font-bold text-xs flex items-center justify-center uppercase">
                          {currentUser.first_name ? currentUser.first_name[0] : currentUser.username[0]}
                        </div>
                        <span className="text-xs font-bold text-slate-700 max-w-[90px] truncate">
                          {currentUser.first_name || currentUser.username}
                        </span>
                        <i className="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                      </button>

                      <div className="absolute right-0 mt-1 w-48 bg-white border border-slate-200 rounded-2xl shadow-xl py-1 hidden group-hover:block z-50">
                        <div className="px-3.5 py-2.5 border-b border-slate-100">
                          <p className="text-xs font-bold text-slate-800">{currentUser.full_name}</p>
                          <p className="text-[11px] text-slate-400 truncate">{currentUser.email}</p>
                        </div>
                        <button
                          onClick={() => setCustomerTab('orders')}
                          className="w-full text-left px-3.5 py-2 text-xs text-slate-600 hover:bg-slate-50 flex items-center gap-2">
                          <i className="fa-solid fa-box text-slate-400"></i> My Orders
                        </button>
                        <button
                          onClick={() => setCustomerTab('wishlist')}
                          className="w-full text-left px-3.5 py-2 text-xs text-slate-600 hover:bg-slate-50 flex items-center gap-2">
                          <i className="fa-solid fa-heart text-slate-400"></i> My Wishlist
                        </button>
                        <button
                          onClick={() => setCustomerTab('profile')}
                          className="w-full text-left px-3.5 py-2 text-xs text-slate-600 hover:bg-slate-50 flex items-center gap-2">
                          <i className="fa-solid fa-user text-slate-400"></i> Profile & Addresses
                        </button>
                        <div className="border-t border-slate-100 my-1"></div>
                        <button
                          onClick={onLogout}
                          className="w-full text-left px-3.5 py-2 text-xs text-rose-600 hover:bg-rose-50 flex items-center gap-2 font-medium">
                          <i className="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => onOpenAuthModal('login')}
                        className="text-xs font-bold text-slate-700 hover:text-indigo-600 px-3 py-2">
                        Log In
                      </button>
                      <button
                        onClick={() => onOpenAuthModal('register')}
                        className="text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 px-3.5 py-2 rounded-xl shadow-sm">
                        Sign Up
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </header>

          {/* Secondary Interactive Navigation Bar */}
          <div className="bg-white/95 backdrop-blur-md border-b border-slate-200 py-2.5 px-4 sm:px-8 sticky top-16 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3 text-xs font-bold">
              {/* Category & Shop Shortcuts */}
              <div className="flex flex-wrap items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
                <button
                  onClick={() => { setCustomerTab('shop'); setActiveCategory(''); }}
                  className={`px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    customerTab === 'shop' && !activeCategory ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                  }`}>
                  <i className="fa-solid fa-compass"></i> All Catalog
                </button>
                <button
                  onClick={() => { setCustomerTab('shop'); setActiveCategory('smartphones'); }}
                  className={`px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    customerTab === 'shop' && activeCategory === 'smartphones' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                  }`}>
                  <i className="fa-solid fa-mobile-screen"></i> Smartphones
                </button>
                <button
                  onClick={() => { setCustomerTab('shop'); setActiveCategory('electronics'); }}
                  className={`px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    customerTab === 'shop' && activeCategory === 'electronics' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                  }`}>
                  <i className="fa-solid fa-laptop"></i> Electronics
                </button>
                <button
                  onClick={() => { setCustomerTab('shop'); setActiveCategory('mens-wear'); }}
                  className={`px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    customerTab === 'shop' && activeCategory === 'mens-wear' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                  }`}>
                  <i className="fa-solid fa-shirt"></i> Men's Wear
                </button>
                <button
                  onClick={() => { setCustomerTab('shop'); setActiveCategory('sports-fitness'); }}
                  className={`px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    customerTab === 'shop' && activeCategory === 'sports-fitness' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                  }`}>
                  <i className="fa-solid fa-dumbbell"></i> Sports & Shoes
                </button>
              </div>

              {/* Direct Tab Jumps */}
              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => { if (!currentUser) onOpenAuthModal('login'); else setCustomerTab('orders'); }}
                  className={`px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    customerTab === 'orders' ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                  }`}>
                  <i className="fa-solid fa-box-archive text-amber-500"></i>
                  <span>My Orders</span>
                </button>
                <button
                  onClick={() => { if (!currentUser) onOpenAuthModal('login'); else setCustomerTab('wishlist'); }}
                  className={`px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    customerTab === 'wishlist' ? 'bg-rose-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                  }`}>
                  <i className="fa-solid fa-heart text-rose-500"></i>
                  <span>Wishlist ({wishlistCount})</span>
                </button>
                <button
                  onClick={() => setCartOpen(true)}
                  className="px-3.5 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 flex items-center gap-1.5 font-extrabold transition-all whitespace-nowrap">
                  <i className="fa-solid fa-bag-shopping text-indigo-600"></i>
                  <span>Cart ({cart?.total_items || 0})</span>
                  <span className="text-slate-400 font-normal">|</span>
                  <span>₹{Number(cart?.subtotal || 0).toLocaleString()}</span>
                </button>
              </div>
            </div>
          </div>

          {/* Customer Body View */}
          <main className="flex-1">
            {customerTab === 'shop' && (
              <CustomerShopView
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                activeCategory={activeCategory}
                setActiveCategory={setActiveCategory}
                activeBrand={activeBrand}
                setActiveBrand={setActiveBrand}
                priceRange={priceRange}
                setPriceRange={setPriceRange}
                minRating={minRating}
                setMinRating={setMinRating}
                inStockOnly={inStockOnly}
                setInStockOnly={setInStockOnly}
                ordering={ordering}
                setOrdering={setOrdering}
                onSelectProduct={(prod) => setSelectedProduct(prod)}
                onAddToCart={async (product) => {
                  try {
                    const res = await api.get(`products/${product.slug}/`);
                    const detailed = res.data.data || res.data;
                    const variant = detailed.variants?.[0];
                    if (variant) {
                      await api.post('cart/items/', { variant_id: variant.id, quantity: 1 });
                      fetchCart();
                      showToast(`Added ${product.name} to cart!`);
                    } else {
                      setSelectedProduct(product);
                    }
                  } catch (e) {
                    setSelectedProduct(product);
                  }
                }}
                onToggleWishlist={async (productId) => {
                  if (!currentUser) { onOpenAuthModal('login'); return; }
                  try {
                    await api.post('wishlist/', { product_id: productId });
                    fetchWishlist();
                    showToast('Saved to Wishlist!');
                  } catch (e) {
                    showToast('Could not add to wishlist', 'error');
                  }
                }}
              />
            )}

            {customerTab === 'orders' && (
              <OrdersView
                currentUser={currentUser}
                showToast={showToast}
                onBackToShop={() => setCustomerTab('shop')}
              />
            )}

            {customerTab === 'wishlist' && (
              <WishlistView
                currentUser={currentUser}
                showToast={showToast}
                fetchWishlist={fetchWishlist}
                onSelectProduct={(prod) => setSelectedProduct(prod)}
                onBackToShop={() => setCustomerTab('shop')}
              />
            )}

            {customerTab === 'profile' && (
              <ProfileView
                currentUser={currentUser}
                setCurrentUser={setCurrentUser}
                showToast={showToast}
                onBackToShop={() => setCustomerTab('shop')}
              />
            )}
          </main>

          {/* Cart Drawer */}
          {cartOpen && (
            <CartDrawer
              cart={cart}
              onClose={() => setCartOpen(false)}
              onRefreshCart={fetchCart}
              currentUser={currentUser}
              setAuthModal={onOpenAuthModal}
              showToast={showToast}
              onCheckoutSuccess={() => {
                setCartOpen(false);
                fetchCart();
                setCustomerTab('orders');
              }}
            />
          )}

          {/* Product Detail Modal */}
          {selectedProduct && (
            <ProductModal
              productSlug={selectedProduct.slug || selectedProduct}
              onClose={() => setSelectedProduct(null)}
              currentUser={currentUser}
              showToast={showToast}
              onRefreshCart={fetchCart}

    // =========================================================================
    // SECTION 2: ACCURATE ADMIN PORTAL & CONTROL CENTER
    // =========================================================================
    function AdminPortal({ currentUser, showToast, onSwitchToCustomer, onLogout }) {
      const [currentAdminTab, setCurrentAdminTab] = useState('dashboard');
      // Sub-views: 'dashboard', 'products', 'orders', 'inventory', 'categories', 'coupons', 'reviews', 'users', 'reports'

      const [kpiStats, setKpiStats] = useState(null);
      const [chartsData, setChartsData] = useState(null);
      const [orders, setOrders] = useState([]);
      const [products, setProducts] = useState([]);
      const [categories, setCategories] = useState([]);
      const [brands, setBrands] = useState([]);
      const [inventoryList, setInventoryList] = useState([]);
      const [coupons, setCoupons] = useState([]);
      const [reviews, setReviews] = useState([]);
      const [usersList, setUsersList] = useState([]);

      // Modals
      const [productModal, setProductModal] = useState(null); // 'create' or product object to edit
      const [deleteModal, setDeleteModal] = useState(null); // product object to confirm deletion
      const [categoryModal, setCategoryModal] = useState(false);
      const [brandModal, setBrandModal] = useState(false);
      const [couponModal, setCouponModal] = useState(false);
      const [orderDetailModal, setOrderDetailModal] = useState(null);
      const [restockModal, setRestockModal] = useState(null); // inventory object

      const chartCanvasRef = useRef(null);
      const chartInstanceRef = useRef(null);
      const categoryChartRef = useRef(null);
      const categoryChartInstanceRef = useRef(null);

      const loadDashboardData = () => {
        api.get('admin/dashboard/').then((res) => setKpiStats(res.data.kpis || res.data));
        api.get('admin/analytics/').then((res) => setChartsData(res.data));
        api.get('orders/').then((res) => setOrders(res.data.results || res.data));
        api.get('products/').then((res) => setProducts(res.data.results || res.data));
        api.get('categories/').then((res) => setCategories(res.data.results || res.data));
        api.get('categories/brands/').then((res) => setBrands(res.data.results || res.data));
        api.get('inventory/').then((res) => setInventoryList(res.data.results || res.data));
        api.get('coupons/').then((res) => setCoupons(res.data.results || res.data));
        api.get('reviews/admin/').then((res) => setReviews(res.data.results || res.data));
        api.get('auth/admin/users/').then((res) => setUsersList(res.data.results || res.data));
      };

      useEffect(() => {
        loadDashboardData();
      }, []);

      // Draw Chart.js graphs on dashboard
      useEffect(() => {
        if (currentAdminTab === 'dashboard' && chartsData) {
          // 1. Sales trend line chart
          if (chartCanvasRef.current) {
            if (chartInstanceRef.current) chartInstanceRef.current.destroy();
            const ctx = chartCanvasRef.current.getContext('2d');
            chartInstanceRef.current = new Chart(ctx, {
              type: 'line',
              data: {
                labels: chartsData.daily_sales?.map((d) => d.date) || ['Day 1', 'Day 2', 'Day 3'],
                datasets: [{
                  label: 'Revenue (₹)',
                  data: chartsData.daily_sales?.map((d) => d.revenue) || [10000, 25000, 30000],
                  borderColor: '#6366f1',
                  backgroundColor: 'rgba(99, 102, 241, 0.12)',
                  borderWidth: 3,
                  tension: 0.35,
                  fill: true,
                  pointBackgroundColor: '#4f46e5',
                  pointRadius: 4,
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                  y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } },
                  x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                }
              }
            });
          }

          // 2. Category distribution doughnut chart
          if (categoryChartRef.current) {
            if (categoryChartInstanceRef.current) categoryChartInstanceRef.current.destroy();
            const cCtx = categoryChartRef.current.getContext('2d');
            categoryChartInstanceRef.current = new Chart(cCtx, {
              type: 'doughnut',
              data: {
                labels: chartsData.category_revenue?.map((c) => c.category) || ['Phones', 'Apparel', 'Audio'],
                datasets: [{
                  data: chartsData.category_revenue?.map((c) => c.revenue) || [120000, 45000, 30000],
                  backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#3b82f6'],
                  borderWidth: 0,
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
                }
              }
            });
          }
        }
      }, [currentAdminTab, chartsData]);

      // Product Actions
      const handleSaveProduct = async (formData) => {
        try {
          if (productModal?.id) {
            // Edit
            await api.patch(`products/${productModal.slug}/`, formData);
            showToast('Product updated successfully.');
          } else {
            // Create
            await api.post('products/', formData);
            showToast('New product created successfully.');
          }
          setProductModal(null);
          loadDashboardData();
        } catch (err) {
          showToast(err.response?.data?.message || 'Error saving product', 'error');
        }
      };

      const handleDeleteProduct = async () => {
        if (!deleteModal) return;
        try {

    function AdminProductFormModal({ product, categories, brands, onClose, onSave }) {

        name: product?.name || '',
        sku: product?.sku || '',
        category_id: product?.category?.id || (categories[0]?.id || ''),
        brand_id: product?.brand?.id || (brands[0]?.id || ''),
        base_price: product?.base_price || '',
        discount_percentage: product?.discount_percentage || '0.00',
        description: product?.description || '',
        image_url: product?.image_url || product?.primary_image || '',
        initial_stock: 20,
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(form);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-xl w-full max-h-[90vh] overflow-y-auto">

              <div>

                  <label className="text-slate-400 font-bold block mb-1">Category</label>

                <div>
                  <label className="text-slate-400 font-bold block mb-1">Brand</label>

                    type="number"

          </div>

      );

    function CartDrawer({ cart, onClose, onRefreshCart, currentUser, setAuthModal, showToast, onCheckoutSuccess }) {
      const [couponCode, setCouponCode] = useState('');
      const [couponDiscount, setCouponDiscount] = useState(0);
      const [appliedCoupon, setAppliedCoupon] = useState(null);
      const [paymentMethod, setPaymentMethod] = useState('razorpay');
      const [isCheckingOut, setIsCheckingOut] = useState(false);
      const [userAddresses, setUserAddresses] = useState([]);
      const [selectedAddressId, setSelectedAddressId] = useState(null);

      useEffect(() => {
        if (currentUser) {
          api.get('auth/addresses/').then((res) => {
            const addrs = res.data.results || res.data;
            setUserAddresses(addrs);
            const def = addrs.find((a) => a.is_default) || addrs[0];
            if (def) setSelectedAddressId(def.id);
          });
        }
      }, [currentUser]);

      const handleUpdateQty = async (itemId, qty) => {
        try {
          await api.patch(`cart/items/${itemId}/`, { quantity: qty });
          onRefreshCart();
        } catch (err) {
          showToast(err.response?.data?.message || 'Error updating item quantity', 'error');
        }
      };

      const handleRemoveItem = async (itemId) => {
        try {
          await api.delete(`cart/items/${itemId}/`);
          onRefreshCart();
          showToast('Item removed from cart');
        } catch (err) {
          showToast('Error removing item', 'error');
        }
      };

      const handleApplyCoupon = async () => {
        if (!currentUser) { setAuthModal('login'); return; }
        if (!couponCode) return;
        try {
          const res = await api.post('coupons/validate/', { code: couponCode, order_amount: cart.subtotal });
          const cdata = res.data.data?.coupon || res.data.coupon;
          setAppliedCoupon(cdata);
          setCouponDiscount(cdata.discount_applied);
          showToast(`Coupon applied! Saved ₹${cdata.discount_applied}`);
        } catch (err) {
          showToast(err.response?.data?.message || 'Invalid coupon code', 'error');
        }
      };

      const handlePlaceOrder = async () => {
        if (!currentUser) { setAuthModal('login'); return; }

        if (!selectedAddressId && userAddresses.length === 0) {
          try {
            const addrRes = await api.post('auth/addresses/', {
              full_name: currentUser.full_name || 'Valued Customer',
              phone_number: currentUser.phone_number || '+91 9876543210',
              street_address: '42 SmartCart Way',
              city: 'Bengaluru',
              state: 'Karnataka',
              postal_code: '560001',
              country: 'India',
              is_default: true,
            });
            setSelectedAddressId(addrRes.data.id);
          } catch (e) {
            showToast('Please add a shipping address in your profile first.', 'error');
            return;
          }
        }

        setIsCheckingOut(true);
        try {
          const res = await api.post('orders/checkout/', {
            shipping_address_id: selectedAddressId || userAddresses[0]?.id,
            coupon_code: appliedCoupon ? appliedCoupon.code : undefined,
            payment_method: paymentMethod,
          });

          const order = res.data.data?.order || res.data.order;
          const orderNum = order.order_number;

          if (paymentMethod === 'razorpay') {
            const payInit = await api.post('payments/create/', { order_number: orderNum });
            const txnId = payInit.data.data?.transaction_id || payInit.data.transaction_id;

            await api.post('payments/verify/', {
              transaction_id: txnId,
              razorpay_payment_id: `pay_mock_${Date.now()}`,
              razorpay_signature: 'sandbox_mock_signature',
            });
          }

          showToast('Order confirmed and payment verified!');
          onCheckoutSuccess();
        } catch (err) {
          showToast(err.response?.data?.message || 'Checkout error', 'error');
        } finally {
          setIsCheckingOut(false);
        }
      };

      const subtotal = Number(cart?.subtotal || 0);
      const discount = Number(couponDiscount || 0);
      const shipping = subtotal > 999 || subtotal === 0 ? 0 : 99;
      const tax = Math.round((subtotal - discount) * 0.18 * 100) / 100;
      const grandTotal = Math.max(0, subtotal - discount + shipping + tax);

      return (
        <div className="fixed inset-0 z-50 overflow-hidden bg-slate-900/60 backdrop-blur-sm flex justify-end">
          <div className="w-full max-w-md bg-white h-full shadow-2xl flex flex-col">
            <div className="p-5 border-b border-slate-100 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <i className="fa-solid fa-bag-shopping text-indigo-600 text-lg"></i>

    function AuthModal({ type, onClose, onSwitch, onSuccess, showToast }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [passwordConfirm, setPasswordConfirm] = useState('');
      const [firstName, setFirstName] = useState('');
      const [lastName, setLastName] = useState('');
      const [loading, setLoading] = useState(false);

      const isRegister = type === 'register';
      const isAdminLogin = type === 'admin-login';

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);

        if (isRegister) {
          if (password !== passwordConfirm) {
            showToast('Passwords do not match', 'error');
            setLoading(false);
            return;
          }
          try {
            const res = await api.post('auth/register/', {
              email, password, password_confirm: passwordConfirm, first_name: firstName, last_name: lastName
            });
            const data = res.data.data || res.data;
            localStorage.setItem('smartcart_access', data.access);
            localStorage.setItem('smartcart_refresh', data.refresh);
            localStorage.setItem('smartcart_user', JSON.stringify(data.user));
            onSuccess(data.user);
          } catch (err) {
            showToast(err.response?.data?.message || 'Registration failed', 'error');
          } finally { setLoading(false); }
        } else {
          try {
            const res = await api.post('auth/login/', { email, password });
            const data = res.data.data || res.data;
            localStorage.setItem('smartcart_access', data.access);
            localStorage.setItem('smartcart_refresh', data.refresh);
            localStorage.setItem('smartcart_user', JSON.stringify(data.user));
            onSuccess(data.user);
          } catch (err) {
            showToast(err.response?.data?.message || 'Login failed', 'error');
          } finally { setLoading(false); }
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 sm:p-8 shadow-2xl relative">
            <button onClick={onClose} className="absolute top-5 right-5 text-slate-400 hover:text-slate-600">
              <i className="fa-solid fa-xmark text-lg"></i>
            </button>

            <div className="text-center mb-6">
              <div className={`w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl ${
                isAdminLogin ? 'bg-amber-100 text-amber-700' : 'bg-indigo-50 text-indigo-600'
              }`}>
                <i className={`fa-solid ${isAdminLogin ? 'fa-lock' : isRegister ? 'fa-user-plus' : 'fa-arrow-right-to-bracket'}`}></i>
              </div>
              <h3 className="text-xl font-extrabold text-slate-900">
                {isAdminLogin ? 'Admin Portal Access' : isRegister ? 'Join SmartCart' : 'Welcome Back'}
              </h3>
              <p className="text-xs text-slate-400 mt-1">
                {isAdminLogin ? 'Enter administrator credentials to proceed' : 'Sign in to access your orders and saved cart'}
              </p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5">
              {isRegister && (
                <div className="grid grid-cols-2 gap-2">
                  <input type="text" placeholder="First Name" required value={firstName} onChange={(e) => setFirstName(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs" />
                  <input type="text" placeholder="Last Name" required value={lastName} onChange={(e) => setLastName(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs" />
                </div>
              )}
              <input type="email" placeholder="Email address" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs" />
              <input type="password" placeholder="Password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs" />
              {isRegister && (
                <input type="password" placeholder="Confirm Password" required value={passwordConfirm} onChange={(e) => setPasswordConfirm(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs" />
              )}
              <button type="submit" disabled={loading} className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow transition-colors">
                {loading ? 'Please wait...' : isRegister ? 'Sign Up' : 'Sign In'}
              </button>
            </form>

            <div className="mt-5 text-center text-xs text-slate-500">
              {isRegister ? (
                <>Already have an account? <button onClick={() => onSwitch('login')} className="text-indigo-600 font-bold hover:underline">Log In</button></>
              ) : (
                <>New to SmartCart? <button onClick={() => onSwitch('register')} className="text-indigo-600 font-bold hover:underline">Create Account</button></>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  {% endverbatim %}
</body>
</html>
